version: '3.8'

services:
  verityguard:
    build: .
    container_name: verityguard-api
    ports:
      - "5001:5001"
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./checkpoints:/app/checkpoints
    environment:
      - FLASK_ENV=production
      - MAX_CONTENT_LENGTH=16777216
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

networks:
  default:
    name: verityguard-network
